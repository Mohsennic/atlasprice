<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ساخت تصویر لیست قیمت روزانه | اطلس سازه</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <style>
        :root {
            --navy-dark: #0f172a;
            --navy-main: #1e293b;
            --navy-light: #334155;
            --orange-main: #f97316;
            --orange-hover: #ea580c;
            --bg-light: #f8fafc;
            --border-color: #e2e8f0;
            --text-muted: #64748b;
        }
        * { box-sizing: border-box; font-family: 'Vazirmatn', Tahoma, sans-serif; margin: 0; padding: 0; }
        body { background: #f1f5f9; color: var(--navy-dark); padding: 15px 10px; direction: rtl; }
        .wrap { max-width: 980px; margin: 0 auto; }
        .head {
            background: linear-gradient(135deg, var(--navy-dark), var(--navy-main));
            color: #fff; padding: 16px 20px; border-radius: 14px 14px 0 0;
            border-bottom: 4px solid var(--orange-main);
        }
        .head h1 { font-size: 1.15rem; font-weight: 800; }
        .head p { font-size: 0.75rem; color: #94a3b8; margin-top: 3px; }
        .status { font-size: 0.75rem; padding: 8px 20px; background: #e2e8f0; color: var(--navy-light); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; align-items: center; }
        .status.warn { background: #fef3c7; color: #92400e; }
        .btn-small { background: var(--orange-main); color: #fff; border: none; border-radius: 6px; padding: 4px 12px; font-size: 0.75rem; cursor: pointer; }
        .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 14px; align-items: start; }
        @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }
        .card { background: #fff; border: 1px solid var(--border-color); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
        .card h3 { font-size: 0.9rem; border-right: 4px solid var(--orange-main); padding-right: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .card h3 label { font-size: 0.75rem; font-weight: 600; display: flex; gap: 5px; align-items: center; cursor: pointer; }
        .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .fg { display: flex; flex-direction: column; gap: 3px; margin-bottom: 8px; }
        .fg label { font-size: 0.72rem; font-weight: 600; color: var(--navy-light); }
        input[type="text"], input[type="number"] { width: 100%; padding: 7px 9px; border: 1px solid #cbd5e1; border-radius: 7px; font-size: 0.85rem; outline: none; direction: ltr; text-align: right; }
        input[type="text"]:focus, input[type="number"]:focus { border-color: var(--orange-main); box-shadow: 0 0 0 3px rgba(249,115,22,0.15); }
        input.rtl { direction: rtl; }
        .hint { font-size: 0.68rem; color: var(--text-muted); margin-top: 2px; }
        .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px; }
        .seg label { border: 2px solid var(--border-color); border-radius: 9px; padding: 9px; text-align: center; font-weight: 700; font-size: 0.85rem; cursor: pointer; }
        .seg input { display: none; }
        .seg input:checked + span { color: var(--orange-hover); }
        .seg label:has(input:checked) { border-color: var(--orange-main); background: #fff7ed; color: var(--orange-hover); }
        .chk { display: flex; align-items: center; gap: 7px; font-size: 0.8rem; font-weight: 600; margin: 4px 0; cursor: pointer; }
        .chk input { width: 16px; height: 16px; accent-color: var(--orange-main); }
        .fit-list { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px; }
        .btn-main { width: 100%; background: var(--orange-main); color: #fff; border: none; border-radius: 9px; padding: 11px; font-weight: 700; font-size: 0.9rem; cursor: pointer; margin-top: 8px; }
        .btn-main:hover { background: var(--orange-hover); }
        .btn-alt { width: 100%; background: #fff; color: var(--navy-main); border: 1px solid #cbd5e1; border-radius: 9px; padding: 10px; font-weight: 700; font-size: 0.85rem; cursor: pointer; margin-top: 8px; }
        .preview-box { position: sticky; top: 10px; }
        .preview-box canvas { width: 100%; height: auto; border-radius: 10px; border: 1px solid var(--border-color); display: block; background: #0b1218; }
        .warn-line { font-size: 0.72rem; color: #b45309; margin-top: 6px; min-height: 1em; }
        .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--navy-dark); color: #fff; padding: 10px 20px; border-radius: 8px; font-size: 0.85rem; display: none; z-index: 50; }
    </style>
</head>
<body>
<div class="wrap">
    <div class="head">
        <h1>ساخت تصویر لیست قیمت روزانه</h1>
        <p>اطلس سازه · قیمت‌ها خودکار از همان نرخ‌های فرم اصلی محاسبه می‌شود</p>
    </div>
    <div class="status" id="statusBar">
        <span id="statusText">در حال خواندن قیمت‌ها...</span>
        <button class="btn-small" onclick="reloadPrices()">🔄 خواندن دوباره قیمت‌ها</button>
    </div>

    <div class="layout">
        <!-- ستون تنظیمات -->
        <div>
            <div class="card">
                <h3>نوع لیست</h3>
                <div class="seg">
                    <label><input type="radio" name="mode" value="sale" checked><span>💰 لیست فروش</span></label>
                    <label><input type="radio" name="mode" value="partner"><span>🤝 لیست همکار</span></label>
                </div>
                <label class="chk"><input type="checkbox" id="chk_ar"> قیمت‌ها با ضدزنگ باشد (به‌صورت پیش‌فرض بدون ضدزنگ)</label>
            </div>

            <div class="card">
                <h3>والپست منقطع <label><input type="checkbox" id="wp_on" checked> نمایش</label></h3>
                <div class="fg">
                    <label>دهنه‌ها (cm) - با ویرگول جدا کنید</label>
                    <input type="text" id="wp_widths" value="10,13,15,20,22">
                </div>
                <div class="fg">
                    <label>طول‌ها (cm)</label>
                    <input type="text" id="wp_lengths" value="20,30,40">
                </div>
                <div class="grid2">
                    <div class="fg"><label>بال (cm)</label><input type="text" id="wp_flange" value="7"></div>
                    <div class="fg"><label>ضخامت (mm)</label><input type="text" id="wp_thick" value="2"></div>
                </div>
                <div class="hint" id="wp_count"></div>
            </div>

            <div class="card">
                <h3>گیره و قلاب <label><input type="checkbox" id="fit_on" checked> نمایش</label></h3>
                <div class="fg">
                    <label>عنوان جدول</label>
                    <input type="text" class="rtl" id="fit_title" value="گیره و قلاب">
                </div>
                <div class="fit-list" id="fitList"></div>
            </div>

            <div class="card">
                <h3>وادار (H و U) <label><input type="checkbox" id="vd_on" checked> نمایش</label></h3>
                <div style="display:flex; gap:16px; margin-bottom:8px;">
                    <label class="chk"><input type="checkbox" id="vd_U" checked> U (انتهایی)</label>
                    <label class="chk"><input type="checkbox" id="vd_H" checked> H (میانی)</label>
                </div>
                <div class="fg">
                    <label>دهنه‌ها (cm)</label>
                    <input type="text" id="vd_widths" value="10,13,15">
                </div>
                <div class="grid2">
                    <div class="fg"><label>بال (cm)</label><input type="text" id="vd_flange" value="7"></div>
                    <div class="fg"><label>ارتفاع شاخه (cm)</label><input type="text" id="vd_height" value="300"></div>
                    <div class="fg"><label>ضخامت (mm)</label><input type="text" id="vd_thick" value="2"></div>
                </div>
                <div class="hint" id="vd_count"></div>
            </div>
        </div>

        <!-- ستون پیش‌نمایش -->
        <div class="preview-box">
            <div class="card">
                <h3>پیش‌نمایش تصویر</h3>
                <div id="previewHost"></div>
                <div class="warn-line" id="rowWarn"></div>
                <button class="btn-main" onclick="saveCurrent()">⬇️ ذخیره تصویر (لیست انتخاب‌شده)</button>
                <button class="btn-alt" onclick="saveBoth()">⬇️ ذخیره هر دو تصویر (فروش + همکار)</button>
                <button class="btn-alt" onclick="shareCurrent()">📤 اشتراک‌گذاری مستقیم (موبایل)</button>
            </div>
        </div>
    </div>
</div>
<div class="toast" id="toastBox"></div>

// ===================== ابزارهای عددی =====================
function normDigits(s) {
    return String(s)
        .replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
        .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
}
function parseList(s) {
    return normDigits(s).split(/[,،\s;؛]+/).map(Number).filter(n => isFinite(n) && n > 0);
}
function num(s, def) {
    const n = parseFloat(normDigits(s));
    return (isFinite(n) && n > 0) ? n : def;
}
function fa(n) { return Number(n).toLocaleString('fa-IR', { useGrouping: false }); }
function faMoney(n) { return Number(n).toLocaleString('fa-IR'); }
function mm(cm) { return Math.round(cm * 10 * 100) / 100; }
const el = id => document.getElementById(id);

function showToast(msg) {
    const t = el('toastBox');
    t.innerText = msg; t.style.display = 'block';
    setTimeout(() => { t.style.display = 'none'; }, 3000);
}

// ===================== خواندن قیمت‌ها =====================
function applyRecord(r) {
    if (typeof r.st37 === 'number') S.st37 = r.st37;
    if (typeof r.labor === 'number') S.labor = r.labor;
    if (typeof r.ar_kg === 'number') S.ar_kg = r.ar_kg;
    if (r.fittings) S.fittings = { ...S.fittings, ...r.fittings };
    if (r.lastUpdated) S.lastUpdated = r.lastUpdated;
}
function loadLocal() {
    try {
        const raw = localStorage.getItem('atlas_app_settings');
        if (!raw) return false;
        const p = JSON.parse(raw);
        if (!p || typeof p !== 'object') return false;
        applyRecord(p);
        settingsSource = 'local';
        return true;
    } catch (e) { return false; }
}
async function loadCloud() {
    const c = new AbortController();
    const t = setTimeout(() => c.abort(), 7000);
    try {
        const res = await fetch(`https://api.jsonbin.io/v3/b/${CLOUD_BIN_ID}/latest?r=${Date.now()}`, {
            cache: 'no-store',
            headers: { 'X-Master-Key': CLOUD_MASTER_KEY },
            signal: c.signal
        });
        if (res.ok) {
            const d = await res.json();
            const r = d.record || d;
            if (r && r.st37 !== undefined) {
                applyRecord(r);
                settingsSource = 'cloud';
            }
        }
    } catch (e) { /* از قیمت‌های حافظه دستگاه استفاده می‌شود */ }
    finally { clearTimeout(t); }
}
function renderStatus() {
    const bar = el('statusBar'), txt = el('statusText');
    const upd = S.lastUpdated ? ` | آخرین بروزرسانی: ${S.lastUpdated}` : '';
    bar.classList.remove('warn');
    if (settingsSource === 'cloud') txt.textContent = '✅ قیمت‌ها از سرور ابری خوانده شد' + upd;
    else if (settingsSource === 'local') txt.textContent = 'قیمت‌ها از حافظه همین دستگاه خوانده شد' + upd;
    else {
        bar.classList.add('warn');
        txt.textContent = '⚠️ قیمت ذخیره‌شده‌ای پیدا نشد و قیمت‌های پیش‌فرض استفاده شده است. ابتدا فرم اصلی را در همین مرورگر باز کنید و نرخ‌ها را بروزرسانی کنید.';
    }
}
async function reloadPrices() {
    el('statusText').textContent = 'در حال خواندن قیمت‌ها...';
    S = JSON.parse(JSON.stringify(DEFAULT_SETTINGS));
    settingsSource = 'defaults';
    loadLocal();
    renderStatus();
    await loadCloud();
    renderStatus();
    scheduleRender();
}

// ===================== فرمول قیمت (همان فرمول فرم اصلی) =====================
function laborMult(sw) {
    if (sw > 55) return 3.0;
    if (sw > 50) return 2.0;
    if (sw > 45) return 1.7;
    if (sw > 40) return 1.4;
    if (sw > 36) return 1.2;
    return 1.0;
}
function roundUp500(x) { return Math.ceil(x / 500) * 500; }
// w, f, l بر حسب cm ، t بر حسب mm ، فقط ورق سیاه (ST37) ، بدون تخفیف
function plateCost(w, f, devLen, t, withAR) {
    const sw = w + 2 * f;
    const weight = (sw * devLen * t * 7.9) / 10000;
    let cost = weight * (S.st37 + S.labor * laborMult(sw));
    if (withAR) cost += weight * S.ar_kg;
    return cost;
}
function priceWallpost(w, f, l, t, factor, withAR) {
    return roundUp500(plateCost(w, f, l, t, withAR) * factor);
}
function priceVador(type, w, f, l, t, factor, withAR) {
    const devLen = (type === 'H') ? l + Math.floor(l / 100) * 40 : l;
    return roundUp500(plateCost(w, f, devLen, t, withAR) * factor);
}
function priceFitting(key, factor) {
    return roundUp500((S.fittings[key] || 0) * factor);
}

// ===================== تنظیمات فرم (ذخیره در دستگاه) =====================
const CFG_KEY = 'atlas_pricelist_cfg';
const TEXT_IDS = ['wp_widths', 'wp_lengths', 'wp_flange', 'wp_thick', 'fit_title', 'vd_widths', 'vd_flange', 'vd_height', 'vd_thick'];
const CHK_IDS = ['wp_on', 'fit_on', 'vd_on', 'vd_U', 'vd_H', 'chk_ar'];

function buildFitList() {
    const host = el('fitList');
    host.innerHTML = '';
    Object.keys(FIT_LABELS).forEach(k => {
        const lab = document.createElement('label');
        lab.className = 'chk';
        lab.innerHTML = `<input type="checkbox" class="fitchk" value="${k}" ${DEFAULT_FIT_KEYS.includes(k) ? 'checked' : ''}> ${FIT_LABELS[k]}`;
        host.appendChild(lab);
    });
}
function saveCfg() {
    try {
        const cfg = { text: {}, chk: {}, fit: [], mode: getMode() };
        TEXT_IDS.forEach(id => cfg.text[id] = el(id).value);
        CHK_IDS.forEach(id => cfg.chk[id] = el(id).checked);
        document.querySelectorAll('.fitchk').forEach(c => { if (c.checked) cfg.fit.push(c.value); });
        localStorage.setItem(CFG_KEY, JSON.stringify(cfg));
    } catch (e) {}
}
function loadCfg() {
    try {
        const raw = localStorage.getItem(CFG_KEY);
        if (!raw) return;
        const cfg = JSON.parse(raw);
        if (cfg.text) TEXT_IDS.forEach(id => { if (cfg.text[id] !== undefined) el(id).value = cfg.text[id]; });
        if (cfg.chk) CHK_IDS.forEach(id => { if (cfg.chk[id] !== undefined) el(id).checked = cfg.chk[id]; });
        if (Array.isArray(cfg.fit)) document.querySelectorAll('.fitchk').forEach(c => { c.checked = cfg.fit.includes(c.value); });
        if (cfg.mode) {
            const r = document.querySelector(`input[name="mode"][value="${cfg.mode}"]`);
            if (r) r.checked = true;
        }
    } catch (e) {}
}
function getMode() {
    const r = document.querySelector('input[name="mode"]:checked');
    return r ? r.value : 'sale';
}

// ===================== ساخت داده‌های جدول‌ها =====================
function buildSections(mode) {
    const factor = (mode === 'partner') ? 1.10 : 1.14;
    const withAR = el('chk_ar').checked;
    const secs = [];

    if (el('wp_on').checked) {
        const widths = parseList(el('wp_widths').value);
        const lengths = parseList(el('wp_lengths').value);
        const f = num(el('wp_flange').value, 7);
        const t = num(el('wp_thick').value, 2);
        const rows = [];
        widths.forEach(w => lengths.forEach(l => {
            rows.push([
                `${fa(l)} × ${fa(w)} (بال ${fa(f)})`,
                fa(t),
                faMoney(priceWallpost(w, f, l, t, factor, withAR))
            ]);
        }));
        el('wp_count').textContent = `${fa(rows.length)} ردیف`;
        if (rows.length) secs.push({
            title: 'والپست منقطع',
            cols: [{ w: 70, label: 'ردیف' }, { w: 170, label: 'ابعاد (cm)' }, { w: 125, label: 'ضخامت (mm)' }, { w: 174, label: 'قیمت (تومان)' }],
            rows
        });
    }

    if (el('fit_on').checked) {
        const keys = [...document.querySelectorAll('.fitchk')].filter(c => c.checked).map(c => c.value);
        const rows = keys.map(k => [FIT_LABELS[k], faMoney(priceFitting(k, factor))]);
        if (rows.length) secs.push({
            title: el('fit_title').value.trim() || 'اتصالات',
            cols: [{ w: 70, label: 'ردیف' }, { w: 295, label: 'نوع محصول' }, { w: 174, label: 'قیمت (تومان)' }],
            rows
        });
    }

    if (el('vd_on').checked) {
        const widths = parseList(el('vd_widths').value);
        const f = num(el('vd_flange').value, 7);
        const l = num(el('vd_height').value, 300);
        const t = num(el('vd_thick').value, 2);
        const types = [];
        if (el('vd_U').checked) types.push('U');
        if (el('vd_H').checked) types.push('H');
        const rows = [];
        widths.forEach(w => types.forEach(tp => {
            rows.push([
                `\u2066${tp}\u2069 | ${fa(l)} × ${fa(w)} (بال ${fa(f)}) | ضخامت ${fa(t)}`,
                faMoney(priceVador(tp, w, f, l, t, factor, withAR))
            ]);
        }));
        el('vd_count').textContent = `${fa(rows.length)} ردیف`;
        if (rows.length) secs.push({
            title: 'وادار (H و U)',
            cols: [{ w: 70, label: 'ردیف' }, { w: 295, label: 'ابعاد (cm)' }, { w: 174, label: 'قیمت (تومان)' }],
            rows
        });
    }
    return secs;
}

// ===================== رسم تصویر =====================
const X0 = 455, X1 = 994, TW = X1 - X0;
const TOP_Y = 178, BOTTOM_Y = 1312, GAP = 14, TITLE_H = 58, HEAD_H = 36, MAX_ROW_H = 36;
const FONT = "Vazirmatn, Tahoma, sans-serif";

function fitText(ctx, text, cx, cy, maxW, size, weight) {
    let s = size;
    ctx.font = `${weight} ${s}px ${FONT}`;
    while (ctx.measureText(text).width > maxW && s > 8) {
        s -= 0.5;
        ctx.font = `${weight} ${s}px ${FONT}`;
    }
    ctx.fillText(text, cx, cy);
}

function drawSection(ctx, sec, y, rowH) {
    const n = sec.rows.length;
    // نوار عنوان
    const g = ctx.createLinearGradient(X0, y, X0, y + TITLE_H);
    g.addColorStop(0, '#ff9d1c'); g.addColorStop(1, '#f27a00');
    ctx.fillStyle = g;
    ctx.fillRect(X0, y, TW, TITLE_H);
    ctx.fillStyle = '#101418';
    fitText(ctx, sec.title, X0 + TW / 2, y + TITLE_H / 2 + 2, TW - 40, 33, '900');

    // ستون‌ها (از راست به چپ)
    let xr = X1;
    const cols = sec.cols.map(c => { const o = { ...c, xr, xl: xr - c.w }; xr -= c.w; return o; });

    const headY = y + TITLE_H;
    const bodyY = headY + HEAD_H;
    const endY = bodyY + n * rowH;

    // پس‌زمینه ملایم جدول
    ctx.fillStyle = 'rgba(6,12,18,0.55)';
    ctx.fillRect(X0, headY, TW, endY - headY);
    ctx.fillStyle = 'rgba(255,255,255,0.07)';
    ctx.fillRect(X0, headY, TW, HEAD_H);

    // ردیف‌های یک‌درمیان
    for (let i = 0; i < n; i++) {
        if (i % 2 === 1) {
            ctx.fillStyle = 'rgba(255,255,255,0.045)';
            ctx.fillRect(X0, bodyY + i * rowH, TW, rowH);
        }
    }

    // متن سرستون‌ها
    ctx.fillStyle = '#e5e7eb';
    cols.forEach(c => fitText(ctx, c.label, (c.xl + c.xr) / 2, headY + HEAD_H / 2 + 1, c.w - 8, 16, '700'));

    // متن ردیف‌ها
    const fs = Math.max(11, Math.min(20, rowH * 0.62));
    for (let i = 0; i < n; i++) {
        const cy = bodyY + i * rowH + rowH / 2 + 1;
        ctx.fillStyle = '#f1f5f9';
        fitText(ctx, fa(i + 1), (cols[0].xl + cols[0].xr) / 2, cy, cols[0].w - 6, fs, '500');
        sec.rows[i].forEach((cell, j) => {
            const c = cols[j + 1];
            const isPrice = (j === sec.rows[i].length - 1);
            ctx.fillStyle = isPrice ? '#ffbe7a' : '#f8fafc';
            fitText(ctx, cell, (c.xl + c.xr) / 2, cy, c.w - 8, fs, isPrice ? '800' : '700');
        });
    }

    // خطوط افقی
    ctx.lineWidth = 0.8;
    for (let i = 0; i <= n; i++) {
        const yy = bodyY + i * rowH;
        ctx.strokeStyle = (i === 0) ? 'rgba(255,255,255,0.85)' : 'rgba(255,255,255,0.3)';
        ctx.beginPath(); ctx.moveTo(X0, yy); ctx.lineTo(X1, yy); ctx.stroke();
    }
    // خطوط عمودی
    ctx.strokeStyle = 'rgba(255,255,255,0.75)';
    ctx.lineWidth = 1;
    cols.forEach(c => { ctx.beginPath(); ctx.moveTo(c.xl, headY); ctx.lineTo(c.xl, endY); ctx.stroke(); });
    // کادر بیرونی
    ctx.lineWidth = 1.4;
    ctx.strokeStyle = 'rgba(255,255,255,0.95)';
    ctx.strokeRect(X0, headY, TW, endY - headY);

    return endY + GAP;
}

let bgImg = null;
function loadBg() {
    return new Promise(res => {
        if (bgImg) return res(bgImg);
        const im = new Image();
        im.onload = () => { bgImg = im; res(im); };
        im.onerror = () => res(null);
        im.src = BG_SRC;
    });
}

function jalaliToday() {
    return new Intl.DateTimeFormat('fa-IR', { year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
}
function jalaliLatin() {
    try {
        return new Intl.DateTimeFormat('fa-IR-u-nu-latn', { year: 'numeric', month: '2-digit', day: '2-digit' })
            .format(new Date()).replace(/\//g, '-');
    } catch (e) { return new Date().toISOString().slice(0, 10); }
}

async function makeCanvas(mode) {
    try { await Promise.all([document.fonts.load(`900 30px Vazirmatn`), document.fonts.load(`600 15px Vazirmatn`), document.fonts.load(`800 15px Vazirmatn`)]); } catch (e) {}
    const bg = await loadBg();
    const cv = document.createElement('canvas');
    cv.width = W * SCALE; cv.height = H * SCALE;
    const ctx = cv.getContext('2d');
    ctx.scale(SCALE, SCALE);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';
    if (bg) ctx.drawImage(bg, 0, 0, W, H);
    else { ctx.fillStyle = '#0b1218'; ctx.fillRect(0, 0, W, H); }

    ctx.direction = 'rtl';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const secs = buildSections(mode);
    const totalRows = secs.reduce((a, s) => a + s.rows.length, 0);
    const fixed = secs.length * (TITLE_H + HEAD_H) + Math.max(0, secs.length - 1) * GAP;
    const avail = BOTTOM_Y - TOP_Y;
    let rowH = totalRows ? Math.min(MAX_ROW_H, (avail - fixed) / totalRows) : MAX_ROW_H;
    const warn = el('rowWarn');
    if (warn) warn.textContent = (rowH < 21) ? '⚠️ تعداد ردیف‌ها زیاد است و نوشته‌ها ریز می‌شود؛ بهتر است ردیف‌ها را کمتر کنید.' : '';
    rowH = Math.max(14, rowH);

    let y = TOP_Y;
    secs.forEach(s => { y = drawSection(ctx, s, y, rowH); });

    // توضیح و تاریخ پایین جدول‌ها
    const withAR = el('chk_ar').checked;
    ctx.fillStyle = '#ffb25b';
    fitText(ctx, `لیست قیمت ${mode === 'partner' ? 'همکار' : 'فروش'} - ${jalaliToday()}`, X0 + TW / 2, 1331, TW, 17, '800');
    ctx.fillStyle = '#cbd5e1';
    fitText(ctx, `قیمت‌ها ${withAR ? 'با ضدزنگ' : 'بدون ضدزنگ'} است - ابعاد به سانتی‌متر: طول × دهنه (بال)`, X0 + TW / 2, 1354, TW, 13.5, '600');
    return cv;
}

// ===================== پیش‌نمایش و خروجی =====================
let renderTimer = null;
function scheduleRender() {
    clearTimeout(renderTimer);
    renderTimer = setTimeout(renderPreview, 150);
}
async function renderPreview() {
    saveCfg();
    const cv = await makeCanvas(getMode());
    cv.style.width = '100%'; cv.style.height = 'auto';
    el('previewHost').replaceChildren(cv);
}
function fileName(mode) {
    return `Atlas-PriceList-${mode === 'partner' ? 'Partner' : 'Sale'}-${jalaliLatin()}.jpg`;
}
function confirmSource() {
    if (settingsSource !== 'defaults') return true;
    return confirm('قیمت روز در این مرورگر پیدا نشد و قیمت‌های پیش‌فرض استفاده شده است. با این حال تصویر ساخته شود؟');
}
async function canvasToBlob(cv) {
    return new Promise(r => cv.toBlob(r, 'image/jpeg', 0.93));
}
async function downloadMode(mode) {
    const cv = await makeCanvas(mode);
    const blob = await canvasToBlob(cv);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = fileName(mode);
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
async function saveCurrent() {
    if (!confirmSource()) return;
    await downloadMode(getMode());
    showToast('تصویر ذخیره شد.');
    renderPreview();
}
async function saveBoth() {
    if (!confirmSource()) return;
    await downloadMode('sale');
    await new Promise(r => setTimeout(r, 700));
    await downloadMode('partner');
    showToast('هر دو تصویر ذخیره شد.');
    renderPreview();
}
async function shareCurrent() {
    if (!confirmSource()) return;
    const mode = getMode();
    const cv = await makeCanvas(mode);
    const blob = await canvasToBlob(cv);
    const file = new File([blob], fileName(mode), { type: 'image/jpeg' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file] }); } catch (e) {}
    } else {
        showToast('این مرورگر اشتراک‌گذاری مستقیم ندارد؛ از «ذخیره تصویر» استفاده کنید.');
    }
    renderPreview();
}

// ===================== شروع =====================
window.addEventListener('DOMContentLoaded', async () => {
    buildFitList();
    loadCfg();
    loadLocal();
    renderStatus();

    document.querySelectorAll('input').forEach(i => {
        i.addEventListener('input', scheduleRender);
        i.addEventListener('change', scheduleRender);
    });
    renderPreview();

    await loadCloud();
    renderStatus();
    renderPreview();
});
