<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#071224">
<title>گزارش روزانه تولید - اطلس سازه</title>

<!-- فونت وزیرمتن -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
:root {
  --navy-dark: #071224;
  --navy-main: #0b1f3a;
  --navy-card: #122849;
  --orange-main: #f97316;
  --orange-glow: #ea580c;
  --orange-soft: #fff7ed;
  --white: #ffffff;
  --gray-bg: #f1f5f9;
  --gray-border: #cbd5e1;
  --gray-text: #475569;
  --gray-muted: #94a3b8;
  --red-soft: #fef2f2;
  --red-text: #dc2626;
  --radius-lg: 16px;
  --radius-md: 10px;
  --radius-sm: 8px;
}

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Vazirmatn', Tahoma, Arial, sans-serif;
  background-color: var(--gray-bg);
  color: var(--navy-dark);
  line-height: 1.5;
  padding: 16px 12px 40px;
  direction: rtl;
}

.wrap {
  width: 100%;
  max-width: 1050px;
  margin: 0 auto;
}

/* هدر لوکس */
.hero-card {
  background: linear-gradient(135deg, var(--navy-dark) 0%, var(--navy-main) 60%, var(--navy-card) 100%);
  border-radius: var(--radius-lg);
  padding: 22px 20px;
  color: var(--white);
  box-shadow: 0 12px 28px rgba(7, 18, 36, 0.15);
  border-bottom: 4px solid var(--orange-main);
  margin-bottom: 18px;
}

.hero-content {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.hero-title-wrap {
  display: flex;
  align-items: center;
  gap: 12px;
}

.hero-badge {
  background: var(--orange-main);
  color: var(--white);
  font-weight: 800;
  font-size: 13px;
  padding: 4px 10px;
  border-radius: 6px;
  white-space: nowrap;
}

.hero-title {
  font-size: 20px;
  font-weight: 800;
  color: var(--white);
}

.date-bar {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255, 255, 255, 0.2);
  padding: 6px 12px;
  border-radius: var(--radius-md);
  width: fit-content;
}

.date-bar label {
  font-size: 13px;
  color: #e2e8f0;
}

.date-bar input {
  background: transparent;
  border: 0;
  color: #fff;
  font-family: inherit;
  font-size: 13.5px;
  font-weight: 700;
  outline: none;
  width: 160px;
}

/* کارت‌های بخش‌ها */
.card-section {
  background: var(--white);
  border-radius: var(--radius-lg);
  border: 1px solid var(--gray-border);
  padding: 18px 16px;
  margin-bottom: 18px;
  box-shadow: 0 4px 16px rgba(11, 31, 58, 0.04);
}

.section-header {
  margin-bottom: 16px;
  padding-bottom: 10px;
  border-bottom: 1px solid #e2e8f0;
}

.section-title {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 16px;
  font-weight: 800;
  color: var(--navy-main);
}

.title-indicator {
  width: 5px;
  height: 18px;
  background: var(--orange-main);
  border-radius: 4px;
}

/* ردیف‌های ورودی کامپکت و ریسپانسیو بدون اورفلو */
.data-row {
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: var(--radius-md);
  padding: 14px;
  margin-bottom: 12px;
}

.fields-grid {
  display: grid;
  gap: 10px;
  grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0; /* جلوگیری از سرریز فلکس/گرید */
}

.form-group label {
  font-size: 12px;
  font-weight: 700;
  color: var(--navy-card);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.form-group input, 
.form-group select {
  width: 100%;
  height: 40px;
  padding: 0 8px;
  border-radius: var(--radius-sm);
  border: 1.5px solid var(--gray-border);
  background: var(--white);
  color: var(--navy-dark);
  font-family: inherit;
  font-size: 13px;
  outline: none;
}

.form-group input:focus, 
.form-group select:focus {
  border-color: var(--orange-main);
  box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.15);
}

.form-group input::placeholder {
  color: var(--gray-muted);
  font-size: 12px;
}

/* نوار پایین هر ردیف (شامل وزن و دکمه حذف) */
.row-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px dashed #cbd5e1;
  flex-wrap: wrap;
}

.calc-badge {
  background: var(--orange-soft);
  border: 1px solid #fed7aa;
  color: #9a3412;
  font-size: 12.5px;
  font-weight: 700;
  padding: 6px 12px;
  border-radius: 6px;
}

/* دکمه‌ها */
.btn {
  font-family: inherit;
  border: none;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  border-radius: var(--radius-sm);
  font-weight: 700;
}

.btn-add {
  width: 100%;
  height: 42px;
  background: var(--orange-soft);
  color: #c2410c;
  border: 1.5px dashed #fb923c;
  font-size: 13px;
}

.btn-add:hover {
  background: #fed7aa;
  color: #9a3412;
}

.btn-remove {
  background: var(--red-soft);
  color: var(--red-text);
  border: 1px solid #fecaca;
  height: 34px;
  padding: 0 12px;
  font-size: 12px;
}

.btn-remove:hover {
  background: #fee2e2;
  color: #b91c1c;
}

/* باکس جمع کل وزن */
.total-box {
  margin-top: 14px;
  background: linear-gradient(135deg, var(--navy-dark) 0%, var(--navy-main) 100%);
  color: var(--white);
  border-radius: var(--radius-md);
  padding: 14px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-left: 5px solid var(--orange-main);
}

.total-title {
  font-size: 14px;
  font-weight: 600;
  color: #e2e8f0;
}

.total-value {
  font-size: 19px;
  font-weight: 900;
  color: #fb923c;
}

.formula-hint {
  font-size: 11.5px;
  color: var(--gray-muted);
  margin-top: 8px;
}

/* دکمه دانلود PDF */
.action-box {
  margin-top: 22px;
  display: flex;
  justify-content: flex-end;
}

.btn-download-pdf {
  width: 100%;
  max-width: 280px;
  height: 50px;
  background: linear-gradient(135deg, var(--orange-main) 0%, var(--orange-glow) 100%);
  color: var(--white);
  font-size: 15px;
  font-weight: 800;
  box-shadow: 0 8px 20px rgba(234, 88, 12, 0.25);
}

.btn-download-pdf:hover {
  box-shadow: 0 12px 24px rgba(234, 88, 12, 0.35);
}

/* استیج PDF ایزوله بدون بیرون‌زدگی و بدون صفحه سفید */
#pdfStage {
  position: absolute;
  top: 0;
  left: 0;
  width: 794px;
  min-height: 1123px;
  background: #ffffff !important;
  color: #0f172a !important;
  padding: 32px;
  direction: rtl;
  font-family: 'Vazirmatn', Tahoma, Arial, sans-serif;
  z-index: -999;
  opacity: 0;
  pointer-events: none;
}

#pdfStage .pdf-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 3px solid var(--orange-main);
  padding-bottom: 12px;
  margin-bottom: 16px;
}

#pdfStage .pdf-title {
  font-size: 19px;
  font-weight: 900;
  color: #0f172a;
}

#pdfStage .pdf-meta {
  font-size: 13px;
  font-weight: 700;
  color: #475569;
}

#pdfStage h3 {
  font-size: 13.5px;
  font-weight: 800;
  color: #0f172a;
  border-right: 4px solid var(--orange-main);
  padding-right: 8px;
  margin: 16px 0 8px;
}

#pdfStage table {
  width: 100%;
  border-collapse: collapse;
  margin-bottom: 12px;
  font-size: 11.5px;
}

#pdfStage th, #pdfStage td {
  border: 1px solid #cbd5e1;
  padding: 7px 5px;
  text-align: right;
}

#pdfStage th {
  background: #0f172a !important;
  color: #ffffff !important;
}

#pdfStage tr:nth-child(even) {
  background-color: #f8fafc;
}

#pdfStage .pdf-total-box {
  background: #fff7ed;
  border-right: 4px solid var(--orange-main);
  padding: 8px 12px;
  font-weight: 800;
  color: #9a3412;
  font-size: 12.5px;
}

@media (min-width: 680px) {
  body { padding: 24px; }
  .hero-content {
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
  }
  .sheet-grid {
    grid-template-columns: 1.3fr 0.9fr 1fr 1fr 1fr 1.1fr;
  }
  .cut-grid {
    grid-template-columns: 1.5fr 1fr 1fr 1.2fr;
  }
  .prod-grid {
    grid-template-columns: 1.2fr 1.4fr 1fr 1fr 1fr;
  }
}
</style>
</head>

<body>
<div class="wrap">

  <header class="hero-card">
    <div class="hero-content">
      <div class="hero-title-wrap">
        <span class="hero-badge">اطلس سازه</span>
        <h1 class="hero-title">گزارش روزانه تولید</h1>
      </div>
      <div class="date-bar">
        <label for="reportDate">تاریخ امروز:</label>
        <input id="reportDate" readonly aria-label="تاریخ شمسی">
      </div>
    </div>
  </header>

  <!-- بخش ۱: ورودی ورق -->
  <section class="card-section">
    <div class="section-header">
      <div class="section-title">
        <span class="title-indicator"></span>
        <h2>ورودی ورق به کارگاه</h2>
      </div>
    </div>
    <div id="sheets"></div>
    <button type="button" class="btn btn-add" id="addSheet">＋ افزودن ردیف ورق جدید</button>

    <div class="total-box">
      <span class="total-title">جمع کل وزن محاسباتی ورق‌ها:</span>
      <span class="total-value"><span id="totalWeight">۰</span> <small style="font-size:13px;color:#cbd5e1">کیلوگرم</small></span>
    </div>
    <p class="formula-hint">فرمول محاسبه وزن: (طول cm × عرض cm × ضخامت mm × ۷٫۸ × تعداد) ÷ ۱۰۰۰۰</p>
  </section>

  <!-- بخش ۲: برش روزانه ورق -->
  <section class="card-section">
    <div class="section-header">
      <div class="section-title">
        <span class="title-indicator"></span>
        <h2>برش روزانه ورق</h2>
      </div>
    </div>
    <div id="cuts"></div>
    <button type="button" class="btn btn-add" id="addCut">＋ افزودن ردیف برش جدید</button>
  </section>

  <!-- بخش ۳: محصولات تولید شده -->
  <section class="card-section">
    <div class="section-header">
      <div class="section-title">
        <span class="title-indicator"></span>
        <h2>محصولات تولید شده</h2>
      </div>
    </div>
    <div id="products"></div>
    <button type="button" class="btn btn-add" id="addProduct">＋ افزودن ردیف محصول جدید</button>
  </section>

  <!-- دکمه خروجی PDF -->
  <div class="action-box">
    <button type="button" class="btn btn-download-pdf" id="pdfButton">
      📥 دانلود خروجی PDF
    </button>
  </div>

</div>

<!-- استیج PDF ایزوله -->
<div id="pdfStage" aria-hidden="true"></div>

<script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js"></script>

<script>
'use strict';

const SHEET_TYPES = ['سیاه ST37', 'گالوانیزه'];
const PRODUCT_TYPES = ['والپست منقطع', 'وادار انتهایی', 'وادار میانی', 'اتصالات'];

const faNum = n => new Intl.NumberFormat('fa-IR', {maximumFractionDigits: 2}).format(Number.isFinite(n) ? n : 0);

const dateEl = document.getElementById('reportDate');
try {
  dateEl.value = new Intl.DateTimeFormat('fa-IR-u-ca-persian', {dateStyle: 'long'}).format(new Date());
} catch(_) {
  dateEl.value = new Date().toLocaleDateString('fa-IR');
}

const sheets = document.getElementById('sheets');
const cuts = document.getElementById('cuts');
const products = document.getElementById('products');

function makeField(label, control) {
  const box = document.createElement('div');
  box.className = 'form-group';
  const l = document.createElement('label');
  l.textContent = label;
  box.append(l, control);
  return box;
}

function makeInput(type='number', placeholder='', min='0', step='any') {
  const el = document.createElement('input');
  el.type = type;
  el.placeholder = placeholder;
  if(type === 'number') {
    el.min = min;
    el.step = step;
    el.inputMode = 'decimal';
  }
  return el;
}

function makeSelect(options) {
  const s = document.createElement('select');
  options.forEach(v => {
    const o = document.createElement('option');
    o.value = v;
    o.textContent = v;
    s.append(o);
  });
  return s;
}

function addSheet() {
  const r = document.createElement('div');
  r.className = 'data-row sheet-row';

  const grid = document.createElement('div');
  grid.className = 'fields-grid sheet-grid';

  const type = makeSelect(SHEET_TYPES);
  const count = makeInput('number', 'تعداد', '1', '1');
  const length = makeInput('number', 'طول cm', '0.01', 'any');
  const width = makeInput('number', 'عرض cm', '0.01', 'any');
  const thick = makeInput('number', 'ضخامت mm', '0.01', 'any');
  const scale = makeInput('number', 'وزن باسکول kg', '0', 'any');

  grid.append(
    makeField('نوع ورق', type),
    makeField('تعداد', count),
    makeField('طول (cm)', length),
    makeField('عرض (cm)', width),
    makeField('ضخامت (mm)', thick),
    makeField('وزن باسکول (kg)', scale)
  );

  const footer = document.createElement('div');
  footer.className = 'row-footer';

  const calc = document.createElement('div');
  calc.className = 'calc-badge';
  calc.innerHTML = 'وزن محاسباتی: <strong class="badge-val">۰ کیلوگرم</strong>';

  const btnDel = document.createElement('button');
  btnDel.type = 'button';
  btnDel.className = 'btn btn-remove';
  btnDel.textContent = '✕ حذف این ردیف';
  btnDel.addEventListener('click', () => {
    r.remove();
    updateWeight();
  });

  footer.append(calc, btnDel);
  r.append(grid, footer);

  r.querySelectorAll('input').forEach(x => x.addEventListener('input', updateWeight));
  sheets.append(r);
  updateWeight();
}

function addCut() {
  const r = document.createElement('div');
  r.className = 'data-row cut-row';

  const grid = document.createElement('div');
  grid.className = 'fields-grid cut-grid';

  grid.append(
    makeField('نوع ورق', makeSelect(SHEET_TYPES)),
    makeField('طول (cm)', makeInput('number', 'مثلاً ۲۰۰', '0.01', 'any')),
    makeField('عرض (cm)', makeInput('number', 'مثلاً ۱۰۰', '0.01', 'any')),
    makeField('تعداد برش‌خورده', makeInput('number', 'تعداد', '0', '1'))
  );

  const footer = document.createElement('div');
  footer.className = 'row-footer';

  const btnDel = document.createElement('button');
  btnDel.type = 'button';
  btnDel.className = 'btn btn-remove';
  btnDel.textContent = '✕ حذف این ردیف';
  btnDel.addEventListener('click', () => r.remove());

  footer.append(document.createElement('div'), btnDel);
  r.append(grid, footer);
  cuts.append(r);
}

function addProduct() {
  const r = document.createElement('div');
  r.className = 'data-row prod-row';

  const grid = document.createElement('div');
  grid.className = 'fields-grid prod-grid';

  grid.append(
    makeField('نوع محصول', makeSelect(PRODUCT_TYPES)),
    makeField('نام قطعه', makeInput('text', 'مثلاً U15، گیره...')),
    makeField('سایز', makeInput('text', 'مثلاً ۱۵')),
    makeField('ابعاد', makeInput('text', 'مثلاً ۳ متر')),
    makeField('تعداد', makeInput('number', 'تعداد', '0', '1'))
  );

  const footer = document.createElement('div');
  footer.className = 'row-footer';

  const btnDel = document.createElement('button');
  btnDel.type = 'button';
  btnDel.className = 'btn btn-remove';
  btnDel.textContent = '✕ حذف این ردیف';
  btnDel.addEventListener('click', () => r.remove());

  footer.append(document.createElement('div'), btnDel);
  r.append(grid, footer);
  products.append(r);
}

function getRowValues(row) {
  return [...row.querySelectorAll('input, select')].map(x => x.value.trim());
}

function calcRowWeight(sheetRow) {
  const inputs = [...sheetRow.querySelectorAll('.fields-grid input')];
  const count = parseFloat(inputs[0].value) || 0;
  const len = parseFloat(inputs[1].value) || 0;
  const wid = parseFloat(inputs[2].value) || 0;
  const thick = parseFloat(inputs[3].value) || 0;
  return (len * wid * thick * 7.8 * count) / 10000;
}

function updateWeight() {
  let total = 0;
  sheets.querySelectorAll('.sheet-row').forEach(r => {
    const kg = calcRowWeight(r);
    total += kg;
    const badgeVal = r.querySelector('.badge-val');
    if (badgeVal) badgeVal.textContent = faNum(kg) + ' کیلوگرم';
  });
  document.getElementById('totalWeight').textContent = faNum(total);
}

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function makeTableHTML(headers, rows) {
  if(!rows.length) return '<p style="color:#64748b;font-size:12px;margin:6px 0">موردی ثبت نشده است.</p>';
  return '<table><thead><tr>' +
    headers.map(x => '<th>' + esc(x) + '</th>').join('') +
    '</tr></thead><tbody>' +
    rows.map(r => '<tr>' + r.map(x => '<td>' + esc(x || '—') + '</td>').join('') + '</tr>').join('') +
    '</tbody></table>';
}

function buildPDFStage() {
  const stage = document.getElementById('pdfStage');

  let total = 0;
  const sheetRows = [...sheets.querySelectorAll('.sheet-row')].map(r => {
    const [type, count, len, wid, thick, scale] = getRowValues(r);
    const kg = calcRowWeight(r);
    total += kg;
    return [type, count, len, wid, thick, faNum(kg), scale];
  });

  const cutRows = [...cuts.querySelectorAll('.cut-row')].map(r => getRowValues(r));
  const prodRows = [...products.querySelectorAll('.prod-row')].map(r => getRowValues(r));

  stage.innerHTML =
    '<div class="pdf-header">' +
      '<div class="pdf-title">گزارش روزانه تولید - اطلس سازه</div>' +
      '<div class="pdf-meta">تاریخ: ' + esc(dateEl.value) + '</div>' +
    '</div>' +
    '<h3>ورودی ورق</h3>' +
    makeTableHTML(['نوع ورق', 'تعداد', 'طول (cm)', 'عرض (cm)', 'ضخامت (mm)', 'وزن محاسباتی (kg)', 'وزن باسکول (kg)'], sheetRows) +
    '<div class="pdf-total-box">جمع کل وزن محاسباتی: ' + esc(faNum(total)) + ' کیلوگرم</div>' +
    '<h3>برش روزانه ورق</h3>' +
    makeTableHTML(['نوع ورق', 'طول (cm)', 'عرض (cm)', 'تعداد برش‌خورده'], cutRows) +
    '<h3>محصولات تولید شده</h3>' +
    makeTableHTML(['نوع محصول', 'نام قطعه', 'سایز', 'ابعاد', 'تعداد'], prodRows);
}

async function makePDF() {
  const btn = document.getElementById('pdfButton');

  if (!window.html2pdf) {
    alert('کتابخانه PDF بارگذاری نشد. لطفاً اینترنت را بررسی کنید.');
    return;
  }

  btn.disabled = true;
  const oldText = btn.textContent;
  btn.textContent = '⏳ در حال ساخت فایل PDF...';

  const element = document.getElementById('pdfStage');

  try {
    buildPDFStage();
    element.style.opacity = '1';
    element.style.zIndex = '99999';

    const opt = {
      margin: [10, 10, 10, 10],
      filename: `گزارش-تولید-${new Date().toISOString().slice(0,10)}.pdf`,
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: {
        scale: 2,
        useCORS: true,
        backgroundColor: '#ffffff',
        logging: false,
        scrollY: 0
      },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
    };

    await html2pdf().set(opt).from(element).save();
  } catch (e) {
    console.error(e);
    alert('خطا در تولید فایل PDF.');
  } finally {
    element.style.opacity = '0';
    element.style.zIndex = '-999';
    btn.disabled = false;
    btn.textContent = oldText;
  }
}
