<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محاسبه قیمت والپست - اطلس سازه</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        :root {
            --primary: #1e3a8a;
            --primary-hover: #1e40af;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #16a34a;
            --danger: #dc2626;
            --accent: #f59e0b;
        }

        * {
            box-sizing: border-box;
            font-family: 'Vazirmatn', sans-serif;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            padding: 16px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border);
            padding-bottom: 12px;
            margin-bottom: 16px;
        }

        .header h1 {
            font-size: 1.25rem;
            color: var(--primary);
            font-weight: 800;
        }

        .badge-mode {
            font-size: 0.8rem;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: 600;
        }

        .badge-client { background: #e0f2fe; color: #0369a1; }
        .badge-partner { background: #dcfce7; color: #15803d; }
        .badge-admin { background: #fef3c7; color: #b45309; }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .full-width {
            grid-column: span 2;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        input, select {
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
            background: #fff;
        }

        input:focus, select:focus {
            border-color: var(--primary);
        }

        .btn {
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .btn-primary { background: var(--primary); color: #fff; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-success { background: var(--success); color: #fff; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-main); }
        .btn-danger-outline { background: transparent; border: 1px solid #fca5a5; color: var(--danger); font-size: 0.8rem; padding: 6px 12px; }

        .items-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        .item-card {
            background: #f1f5f9;
            border-radius: 8px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
        }

        .item-delete {
            color: var(--danger);
            cursor: pointer;
            font-weight: bold;
            font-size: 1.2rem;
            padding: 4px 8px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px dashed var(--border);
            font-size: 0.95rem;
        }

        .summary-row.total {
            border-bottom: none;
            font-size: 1.15rem;
            font-weight: 800;
            color: var(--primary);
            padding-top: 12px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            padding: 16px;
            z-index: 100;
        }

        .modal-content {
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            max-width: 450px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            user-select: none;
        }
        
        .checkbox-group input {
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="header">
            <div>
                <h1>اطلس سازه</h1>
                <small style="color: var(--text-muted);">محاسبه آنلاین قیمت والپست</small>
            </div>
            <div style="display: flex; gap: 8px; align-items: center;">
                <span id="mode-badge" class="badge-mode badge-client">مشتری</span>
                <button onclick="openAuthModal()" style="border:none; background:none; cursor:pointer; font-size:1.2rem;">⚙️</button>
            </div>
        </div>

        <form id="item-form" onsubmit="addItem(event)">
            <div class="form-grid">
                <div class="form-group full-width">
                    <label>نوع مقطع</label>
                    <select id="item-type" onchange="toggleFormFields()">
                        <option value="u-post">وادار U (ناودانی منقطع)</option>
                        <option value="h-post">وادار H</option>
                        <option value="rod">میلگرد بستر</option>
                        <option value="hook">قلاب و گیره</option>
                        <option value="plate">پلیت اتصال</option>
                    </select>
                </div>

                <div class="form-group sheet-field">
                    <label>عرض جان (cm)</label>
                    <input type="number" id="web-width" value="15" step="0.5" required>
                </div>

                <div class="form-group sheet-field">
                    <label>طول بال (cm)</label>
                    <input type="number" id="flange-len" value="7" step="0.5" required>
                </div>

                <div class="form-group sheet-field">
                    <label>طول شاخه (cm)</label>
                    <input type="number" id="length-cm" value="300" step="1" required>
                </div>

                <div class="form-group sheet-field">
                    <label>ضخامت ورق (mm)</label>
                    <select id="thickness">
                        <option value="2">۲ میل</option>
                        <option value="2.5">۲.۵ میل</option>
                        <option value="3">۳ میل</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <label>تعداد (شاخه / عدد)</label>
                    <input type="number" id="quantity" value="10" min="1" required>
                </div>

                <div class="form-group full-width sheet-field">
                    <label class="checkbox-group">
                        <input type="checkbox" id="has-primer" checked>
                        <span>همراه با رنگ ضد زنگ (با کسر ۳,۰۰۰ تومان در صورت عدم نیاز)</span>
                    </label>
                </div>

                <button type="submit" class="btn btn-primary full-width">➕ افزودن به لیست استعلام</button>
            </div>
        </form>
    </div>

    <div class="card" id="cart-card">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3 style="font-size: 1rem;">فاکتور اقلام</h3>
            <button onclick="clearAllItems()" class="btn btn-danger-outline">🗑 پاک کردن کل لیست</button>
        </div>

        <div class="items-list" id="items-container">
            <div style="text-align: center; color: var(--text-muted); padding: 16px;">هنوز آیتمی اضافه نشده است.</div>
        </div>

        <div style="margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border);">
            <div class="summary-row">
                <span>وزن کل برآورد شده:</span>
                <span id="total-weight">۰ کیلوگرم</span>
            </div>
            <div class="summary-row">
                <span>جمع پایه اقلام:</span>
                <span id="base-price">۰ تومان</span>
            </div>
            <div class="summary-row" id="discount-row" style="display: none; color: var(--success);">
                <span id="discount-label">تخفیف پلکانی:</span>
                <span id="discount-amount">۰ تومان</span>
            </div>
            <div class="summary-row total">
                <span>مبلغ کل نهایی:</span>
                <span id="final-price">۰ تومان</span>
            </div>
        </div>

        <button onclick="shareToEitaa()" class="btn btn-success" style="margin-top: 16px; width: 100%;">
            📤 ارسال پیش‌فاکتور در ایتا
        </button>
    </div>
</div>

<!-- مودال احراز هویت -->
<div id="auth-modal" class="modal">
    <div class="modal-content">
        <h3>ورود همکار / مدیریت</h3>
        <input type="password" id="access-code" placeholder="رمز عبور را وارد کنید...">
        <div style="display: flex; gap: 8px;">
            <button onclick="checkAccess()" class="btn btn-primary" style="flex:1;">ورود</button>
            <button onclick="closeAuthModal()" class="btn btn-outline">انصراف</button>
        </div>
    </div>
</div>

<!-- مودال تنظیمات قیمت -->
<div id="admin-modal" class="modal">
    <div class="modal-content">
        <h3>تنظیمات نرخ‌های پایه (مدیریت)</h3>
        <div class="form-group">
            <label>قیمت پایه ورق ۲ میل (تومان/کیلو):</label>
            <input type="number" id="adm-sheet-2">
        </div>
        <div class="form-group">
            <label>قیمت پایه ورق ۲.۵ میل (تومان/کیلو):</label>
            <input type="number" id="adm-sheet-25">
        </div>
        <div class="form-group">
            <label>قیمت پایه ورق ۳ میل (تومان/کیلو):</label>
            <input type="number" id="adm-sheet-3">
        </div>
        <div class="form-group">
            <label>اجرت خدمات و برش (تومان/کیلو):</label>
            <input type="number" id="adm-service">
        </div>
        <div class="form-group">
            <label>قیمت هر عدد میلگرد بستر (تومان):</label>
            <input type="number" id="adm-rod">
        </div>
        <div class="form-group">
            <label>قیمت هر عدد قلاب و گیره (تومان):</label>
            <input type="number" id="adm-hook">
        </div>
        <div class="form-group">
            <label>قیمت هر عدد پلیت (تومان):</label>
            <input type="number" id="adm-plate">
        </div>
        <div style="display: flex; gap: 8px; margin-top: 10px;">
            <button onclick="saveAdminPrices()" class="btn btn-primary" style="flex:1;">ذخیره تنظیمات</button>
            <button onclick="closeAdminModal()" class="btn btn-outline">بستن</button>
        </div>
    </div>
</div>

<script>
    // پایگاه نرخ‌های پیش‌فرض
    let config = {
        sheet2: 43000,
        sheet25: 42500,
        sheet3: 42000,
        service: 5000,
        rodPrice: 38000,
        hookPrice: 16000,
        platePrice: 22000,
        primerCost: 3000,
        density: 7.9,
        clientMargin: 1.04 // ۴ درصد سود برای مشتری عادی
    };

    let userRole = 'client'; // 'client', 'partner', 'admin'
    let cart = [];

    // بارگذاری تنظیمات از حافظه در صورت وجود
    const savedConfig = localStorage.getItem('atlas_cfg');
    if (savedConfig) {
        config = { ...config, ...JSON.parse(savedConfig) };
    }

    function toggleFormFields() {
        const type = document.getElementById('item-type').value;
        const sheetFields = document.querySelectorAll('.sheet-field');
        const isSheet = (type === 'u-post' || type === 'h-post');
        sheetFields.forEach(el => el.style.display = isSheet ? 'flex' : 'none');
    }

    function addItem(e) {
        e.preventDefault();
        const type = document.getElementById('item-type').value;
        const qty = parseInt(document.getElementById('quantity').value);
        
        let title = '';
        let unitWeight = 0;
        let unitPrice = 0;

        if (type === 'u-post' || type === 'h-post') {
            const web = parseFloat(document.getElementById('web-width').value);
            const flange = parseFloat(document.getElementById('flange-len').value);
            const len = parseFloat(document.getElementById('length-cm').value);
            const th = parseFloat(document.getElementById('thickness').value);
            const hasPrimer = document.getElementById('has-primer').checked;

            // محاسبه گسترده مقطع
            const perimeterCm = (type === 'u-post') ? (web + (flange * 2)) : (web + (flange * 4));
            
            // وزن = حجم (cm³) * چگالی (7.9) / 1000
            // ضخامت از mm به cm تبدیل می‌شود (th / 10)
            const volumeCm3 = perimeterCm * len * (th / 10);
            unitWeight = (volumeCm3 * config.density) / 1000;

            let sheetBase = config.sheet2;
            if (th === 2.5) sheetBase = config.sheet25;
            if (th === 3) sheetBase = config.sheet3;

            let pricePerKg = sheetBase + config.service;
            if (!hasPrimer) {
                pricePerKg -= config.primerCost;
            }

            unitPrice = unitWeight * pricePerKg;
            title = `${type === 'u-post' ? 'وادار U' : 'وادار H'} (${web}×${flange}) ضخامت ${th} - ${len}cm`;
            if (!hasPrimer) title += ' (بدون ضد زنگ)';
        } else if (type === 'rod') {
            title = 'میلگرد بستر عرض ۱۵';
            unitPrice = config.rodPrice;
            unitWeight = 0.6;
        } else if (type === 'hook') {
            title = 'قلاب و گیره اتصال';
            unitPrice = config.hookPrice;
            unitWeight = 0.2;
        } else if (type === 'plate') {
            title = 'پلیت اتصال';
            unitPrice = config.platePrice;
            unitWeight = 0.4;
        }

        cart.push({
            id: Date.now(),
            title,
            qty,
            unitWeight,
            unitPrice: Math.round(unitPrice)
        });

        renderCart();
    }

    function removeItem(id) {
        cart = cart.filter(item => item.id !== id);
        renderCart();
    }

    function clearAllItems() {
        if (cart.length === 0) return;
        if (confirm('آیا از پاک کردن کل پیش‌فاکتور اطمینان دارید؟')) {
            cart = [];
            renderCart();
        }
    }

    function renderCart() {
        const container = document.getElementById('items-container');
        if (cart.length === 0) {
            container.innerHTML = '<div style="text-align: center; color: var(--text-muted); padding: 16px;">هنوز آیتمی اضافه نشده است.</div>';
            document.getElementById('total-weight').innerText = '۰ کیلوگرم';
            document.getElementById('base-price').innerText = '۰ تومان';
            document.getElementById('final-price').innerText = '۰ تومان';
            document.getElementById('discount-row').style.display = 'none';
            return;
        }

        container.innerHTML = '';
        let totalWeight = 0;
        let subtotal = 0;

        cart.forEach(item => {
            const itemTotalWeight = item.unitWeight * item.qty;
            let itemUnitPrice = item.unitPrice;
            
            if (userRole === 'client') {
                itemUnitPrice = Math.round(itemUnitPrice * config.clientMargin);
            }
            const itemTotalPrice = itemUnitPrice * item.qty;

            totalWeight += itemTotalWeight;
            subtotal += itemTotalPrice;

            const div = document.createElement('div');
            div.className = 'item-card';
            div.innerHTML = `
                <div>
                    <strong>${item.title}</strong>
                    <div style="color: var(--text-muted); font-size: 0.8rem; margin-top: 2px;">
                        تعداد: ${item.qty} | وزن واحد: ${item.unitWeight.toFixed(2)}kg | فی: ${itemUnitPrice.toLocaleString('fa-IR')} ت
                    </div>
                </div>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <span style="font-weight: 700;">${itemTotalPrice.toLocaleString('fa-IR')} ت</span>
                    <span class="item-delete" onclick="removeItem(${item.id})">✕</span>
                </div>
            `;
            container.appendChild(div);
        });

        // محاسبه تخفیف پلکانی
        let discountPercent = 0;
        if (subtotal >= 100000000) discountPercent = 0.03;
        else if (subtotal >= 50000000) discountPercent = 0.02;
        else if (subtotal >= 20000000) discountPercent = 0.01;

        const discountAmount = Math.round(subtotal * discountPercent);
        const finalPrice = subtotal - discountAmount;

        document.getElementById('total-weight').innerText = totalWeight.toFixed(1) + ' کیلوگرم';
        document.getElementById('base-price').innerText = subtotal.toLocaleString('fa-IR') + ' تومان';
        
        if (discountPercent > 0) {
            document.getElementById('discount-row').style.display = 'flex';
            document.getElementById('discount-label').innerText = `تخفیف پلکانی (${discountPercent * 100}%):`;
            document.getElementById('discount-amount').innerText = discountAmount.toLocaleString('fa-IR') + ' تومان-';
        } else {
            document.getElementById('discount-row').style.display = 'none';
        }

        document.getElementById('final-price').innerText = finalPrice.toLocaleString('fa-IR') + ' تومان';
    }

    function openAuthModal() {
        document.getElementById('auth-modal').style.display = 'flex';
    }

    function closeAuthModal() {
        document.getElementById('auth-modal').style.display = 'none';
        document.getElementById('access-code').value = '';
    }

    function checkAccess() {
        const code = document.getElementById('access-code').value.trim();
        const badge = document.getElementById('mode-badge');

        if (code === '1132') {
            userRole = 'admin';
            badge.innerText = 'مدیریت';
            badge.className = 'badge-mode badge-admin';
            closeAuthModal();
            openAdminModal();
        } else if (code === '2244') {
            userRole = 'partner';
            badge.innerText = 'همکار (بدون سود)';
            badge.className = 'badge-mode badge-partner';
            closeAuthModal();
            alert('حالت همکار فعال شد.');
        } else {
            alert('رمز عبور نامعتبر است.');
        }
        renderCart();
    }

    function openAdminModal() {
        document.getElementById('adm-sheet-2').value = config.sheet2;
        document.getElementById('adm-sheet-25').value = config.sheet25;
        document.getElementById('adm-sheet-3').value = config.sheet3;
        document.getElementById('adm-service').value = config.service;
        document.getElementById('adm-rod').value = config.rodPrice;
        document.getElementById('adm-hook').value = config.hookPrice;
        document.getElementById('adm-plate').value = config.platePrice;
        document.getElementById('admin-modal').style.display = 'flex';
    }

    function closeAdminModal() {
        document.getElementById('admin-modal').style.display = 'none';
    }

    function saveAdminPrices() {
        config.sheet2 = parseFloat(document.getElementById('adm-sheet-2').value) || config.sheet2;
        config.sheet25 = parseFloat(document.getElementById('adm-sheet-25').value) || config.sheet25;
        config.sheet3 = parseFloat(document.getElementById('adm-sheet-3').value) || config.sheet3;
        config.service = parseFloat(document.getElementById('adm-service').value) || config.service;
        config.rodPrice = parseFloat(document.getElementById('adm-rod').value) || config.rodPrice;
        config.hookPrice = parseFloat(document.getElementById('adm-hook').value) || config.hookPrice;
        config.platePrice = parseFloat(document.getElementById('adm-plate').value) || config.platePrice;

        localStorage.setItem('atlas_cfg', JSON.stringify(config));
        closeAdminModal();
        renderCart();
        alert('قیمت‌های جدید با موفقیت ذخیره شدند.');
    }

    function shareToEitaa() {
        if (cart.length === 0) {
            alert('ابتدا اقلامی را به پیش‌فاکتور اضافه کنید.');
            return;
        }

        let text = `📋 *پیش‌فاکتور اطلس سازه*\n--------------------------\n`;
        cart.forEach((item, idx) => {
            let uPrice = item.unitPrice;
            if (userRole === 'client') uPrice = Math.round(uPrice * config.clientMargin);
            text += `${idx + 1}. ${item.title}\n   تعداد: ${item.qty} | فی: ${uPrice.toLocaleString('fa-IR')} ت\n`;
        });

        text += `--------------------------\n`;
        text += `⚖️ وزن کل: ${document.getElementById('total-weight').innerText}\n`;
        text += `💰 مبلغ قابل پرداخت: ${document.getElementById('final-price').innerText}\n\n`;
        text += `🔗 استعلام آنلاین: https://mohsennic.github.io/atlasprice/`;

        const url = `https://eitaa.com/share/url?url=${encodeURIComponent(text)}`;
        window.open(url, '_blank');
    }

    // مقداردهی اولیه فرم
    toggleFormFields();
</script>

</body>
</html>
