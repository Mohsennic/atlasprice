<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اطلس سازه | سامانه محاسبات پیشرفته</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
    <style>
        :root { --navy: #0f172a; --orange: #f97316; --bg: #f1f5f9; --red: #e11d48; --card: #ffffff; }
        * { font-family: 'Vazirmatn', sans-serif; box-sizing: border-box; }
        body { background: var(--bg); display: flex; justify-content: center; padding: 15px; margin: 0; }
        .container { width: 100%; max-width: 500px; }
        .card { background: var(--card); border-radius: 20px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-bottom: 20px; }
        
        .header-panel { background: var(--navy); color: white; padding: 20px; border-radius: 20px; text-align: center; margin-bottom: 20px; }
        .badge { font-size: 0.8rem; color: var(--orange); font-weight: bold; margin-bottom: 5px; }
        
        .tabs { display: flex; gap: 8px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 10px; border: 2px solid var(--navy); background: white; color: var(--navy); border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .tab-btn.active { background: var(--navy); color: white; }
        
        .grid-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 15px; }
        input, select { width: 100%; padding: 12px; border: 1.5px solid #e2e8f0; border-radius: 10px; background: #f8fafc; text-align: center; }
        
        .btn-main { width: 100%; padding: 14px; border: none; border-radius: 12px; background: var(--orange); color: white; font-weight: bold; cursor: pointer; }
        .btn-main:hover { opacity: 0.9; }
        
        .result-box { background: var(--navy); color: white; padding: 15px; border-radius: 15px; text-align: center; margin: 15px 0; }
        
        .order-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px dashed #cbd5e1; font-size: 0.9rem; }
        .btn-del { background: #fee2e2; color: var(--red); border: none; border-radius: 6px; width: 28px; height: 28px; cursor: pointer; }
        
        /* مودال */
        .modal { display: none; position: fixed; top:0; left:0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.8); z-index: 1000; justify-content: center; align-items: center; padding: 15px; }
        .modal-content { background: white; padding: 20px; width: 100%; max-width: 450px; border-radius: 20px; max-height: 90vh; overflow-y: auto; }
        .admin-box { background: #f8fafc; padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #e2e8f0; }
        .sync-status { font-size: 0.7rem; color: #38bdf8; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-panel">
        <h2 style="margin:0;">اطلس سازه</h2>
        <div id="badge" class="badge">وضعیت: مشتری</div>
        <div id="syncStatus" class="sync-status">در حال اتصال به فضای ابری...</div>
    </div>

    <div class="tabs">
        <button id="tabWallpost" class="tab-btn active" onclick="switchTab('wallpost')">والپست و وادار</button>
        <button id="tabAccessory" class="tab-btn" onclick="switchTab('accessory')">اتصالات</button>
    </div>

    <!-- فرم والپست -->
    <div class="card" id="sectionWallpost">
        <div class="grid-inputs">
            <div style="grid-column: span 2">
                <select id="prodType" onchange="handleProductChange()">
                    <option value="wallpost">والپست منقطع (ساده)</option>
                    <option value="vador_end">وادار انتهایی</option>
                    <option value="vador_mid">وادار میانی</option>
                </select>
            </div>
            <div><label style="font-size:0.7rem">عرض (cm)</label><input type="number" id="w" value="15" oninput="calc()"></div>
            <div><label style="font-size:0.7rem">بال (cm)</label><input type="number" id="f" value="7" oninput="calc()"></div>
            <div><label style="font-size:0.7rem">طول (cm)</label><input type="number" id="l" value="320" oninput="calc()"></div>
            <div><label style="font-size:0.7rem">ضخامت (mm)</label><input type="number" id="t" value="2" oninput="calc()"></div>
            <div style="grid-column: span 2"><select id="sheetType" onchange="calc()"><option value="st37">ورق سیاه (st37)</option><option value="galv">ورق گالوانیزه</option></select></div>
            <div style="grid-column: span 2"><input type="number" id="count" value="10" placeholder="تعداد شاخه" oninput="calc()"></div>
            <label style="grid-column:span 2; display:flex; align-items:center; gap:10px;"><input type="checkbox" id="noAntiRust" onchange="calc()"> بدون ضد زنگ</label>
        </div>
        <div class="result-box">
            <div id="resUnit" style="font-size:0.8rem">قیمت واحد: ۰</div>
            <div id="resTotal" style="font-size:1.2rem; color:#fbbf24; font-weight:bold;">۰ تومان</div>
        </div>
        <button class="btn-main" onclick="addWallpostOrder()">➕ افزودن به لیست</button>
    </div>

    <!-- فرم اتصالات -->
    <div class="card" id="sectionAccessory" style="display: none;">
        <div class="grid-inputs">
            <div style="grid-column: span 2">
                <select id="accType" onchange="calcAccessory()">
                    <option value="wire_clip">گیره گالوانیزه</option>
                    <option value="hook">قلاب</option>
                    <option value="bed_rebar_55">میلگرد بستر ۵.۵ سانت</option>
                    <option value="bed_rebar_11">میلگرد بستر ۱۱ سانت</option>
                    <option value="bed_rebar_15">میلگرد بستر ۱۵ سانت</option>
                    <option value="rollbolt_12_10">رول بولت</option>
                    <option value="boltex_6">بولتکس</option>
                    <option value="flat_tie">بست تخت</option>
                    <option value="radical_tie">بست رادیکالی</option>
                    <option value="screw_plug">پیچ و رولپلاک</option>
                    <option value="plate">صفحه پلیت</option>
                </select>
            </div>
            <div style="grid-column: span 2"><input type="number" id="accCount" value="100" oninput="calcAccessory()"></div>
        </div>
        <div class="result-box">
            <div id="accResUnit" style="font-size:0.8rem">قیمت واحد: ۰</div>
            <div id="accResTotal" style="font-size:1.2rem; color:#fbbf24; font-weight:bold;">۰ تومان</div>
        </div>
        <button class="btn-main" onclick="addAccessoryOrder()">➕ افزودن اتصال</button>
    </div>

    <div class="card" id="orderList"></div>
    <div style="display:flex; gap:10px;">
        <button id="copyBtn" class="btn-main" style="background:#059669; display:none;" onclick="copyEitaa()">📋 کپی پیش‌فاکتور</button>
    </div>

    <div style="text-align:center; margin-top:20px; color:#64748b; font-size:0.8rem;">
        <span onclick="openAdmin()" style="cursor:pointer;">⚙️ تنظیمات مدیریت</span> | 
        <span onclick="toggleMode()" style="cursor:pointer;">👤 تغییر وضعیت</span>
    </div>
</div>

<!-- مودال مدیریت -->
<div id="modal" class="modal">
    <div class="modal-content">
        <h3 style="text-align:center;">پنل مدیریت و همگام‌سازی</h3>
        <div class="admin-box">
            <div class="grid-inputs">
                <div><label>ورق سیاه</label><input type="number" id="sSt37"></div>
                <div><label>ورق گالوا</label><input type="number" id="sGalv"></div>
                <div><label>مزد ساخت</label><input type="number" id="sLabor"></div>
                <div><label>ضدزنگ والپست</label><input type="number" id="sAntiRustWallpost"></div>
            </div>
        </div>
        <button class="btn-main" style="background:var(--navy)" onclick="saveSettings()">ذخیره و همگام‌سازی ابری</button>
    </div>
</div>

<script>
    const CLOUD_BIN_ID = '6aacef5bac6210605adb76b4';
    const CLOUD_MASTER_KEY = '$2a$10$YS.0unbKgsmiwKQBqMwLVehbD1mds2wcclc4tQtoL55QQY69dL/9q';

    let settings = {
        st37: 30000, galv: 38000, labor: 3500,
        antiRustWallpost: 3000, antiRustVador: 25000,
        d100: 1, d250: 2, d400: 3, d600: 4, d800: 5, d1000: 6,
        p_wire_clip: 8500, p_hook: 7500, p_bed_rebar_55: 22000,
        p_bed_rebar_11: 24000, p_bed_rebar_15: 27000, p_rollbolt_12_10: 19000,
        p_boltex_6: 5500, p_flat_tie: 6000, p_radical_tie: 9500,
        p_screw_plug: 3500, p_plate: 45000
    };

    let orders = [];

    // --- منطق ابری ---
    async function fetchFromCloud() {
        try {
            const res = await fetch(`https://api.jsonbin.io/v3/b/${CLOUD_BIN_ID}/latest`, { headers: {'X-Master-Key': CLOUD_MASTER_KEY} });
            if(res.ok) {
                const data = await res.json();
                settings = data.record;
                document.getElementById('syncStatus').innerText = "✅ همگام‌سازی انجام شد";
                calc(); calcAccessory();
            }
        } catch(e) { document.getElementById('syncStatus').innerText = "⚠️ حالت آفلاین"; }
    }

    async function saveSettings() {
        settings.st37 = parseInt(document.getElementById('sSt37').value);
        settings.galv = parseInt(document.getElementById('sGalv').value);
        settings.labor = parseInt(document.getElementById('sLabor').value);
        settings.antiRustWallpost = parseInt(document.getElementById('sAntiRustWallpost').value);
        
        try {
            await fetch(`https://api.jsonbin.io/v3/b/${CLOUD_BIN_ID}`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json', 'X-Master-Key': CLOUD_MASTER_KEY},
                body: JSON.stringify(settings)
            });
            alert("تغییرات با موفقیت در فضای ابری ذخیره شد.");
            document.getElementById('modal').style.display = 'none';
        } catch(e) { alert("خطا در ذخیره‌سازی ابری"); }
    }

    // --- منطق اصلی (همان کدی که فرستادی) ---
    function switchTab(tab) {
        document.getElementById('sectionWallpost').style.display = (tab === 'wallpost') ? 'block' : 'none';
        document.getElementById('sectionAccessory').style.display = (tab === 'accessory') ? 'block' : 'none';
        document.getElementById('tabWallpost').className = 'tab-btn ' + (tab === 'wallpost' ? 'active' : '');
        document.getElementById('tabAccessory').className = 'tab-btn ' + (tab === 'accessory' ? 'active' : '');
    }

    function calc() {
        const prodType = document.getElementById('prodType').value;
        const w = parseFloat(document.getElementById('w').value) || 0;
        const f = parseFloat(document.getElementById('f').value) || 0;
        const l = parseFloat(document.getElementById('l').value) || 0;
        const t = parseFloat(document.getElementById('t').value) || 0;
        const count = parseFloat(document.getElementById('count').value) || 0;
        const noAntiRust = document.getElementById('noAntiRust').checked;
        const isPart = sessionStorage.getItem('isPart') === 'true';
        const sheetType = document.getElementById('sheetType').value;

        let effectiveLength = l;
        let isVador = (prodType !== 'wallpost');
        
        if(prodType === 'vador_mid') effectiveLength = l + (Math.floor(l/100) * 40);

        let pKg = (prodType === 'wallpost' && sheetType === 'galv') ? settings.galv : settings.st37;
        let weightKg = ((w + 2 * f) * effectiveLength * t * 7.9) / 10000;
        let baseCost = (weightKg * (pKg + settings.labor)) + (noAntiRust ? 0 : (isVador ? settings.antiRustVador : settings.antiRustWallpost));
        
        let disc = count >= 1000 ? settings.d1000 : count >= 800 ? settings.d800 : count >= 600 ? settings.d600 : count >= 400 ? settings.d400 : count >= 250 ? settings.d250 : count >= 100 ? settings.d100 : 0;
        let final = baseCost * 1.10 * (1 - (disc / 100));
        if(!isPart) final *= 1.04;
        
        let unit = Math.ceil(final / 500) * 500;
        document.getElementById('resUnit').innerText = "قیمت واحد: " + unit.toLocaleString();
        document.getElementById('resTotal').innerText = (unit * count).toLocaleString() + " تومان";
        return { desc: prodType + " - " + l + "cm", unit, count, isDiscounted: disc > 0 };
    }

    function calcAccessory() {
        const accType = document.getElementById('accType').value;
        const count = parseFloat(document.getElementById('accCount').value) || 0;
        const isPart = sessionStorage.getItem('isPart') === 'true';
        let base = settings['p_' + accType] || 0;
        if(!isPart) base *= 1.04;
        let unit = Math.ceil(base / 500) * 500;
        document.getElementById('accResUnit').innerText = "قیمت واحد: " + unit.toLocaleString();
        document.getElementById('accResTotal').innerText = (unit * count).toLocaleString() + " تومان";
        return { desc: accType, unit, count, isDiscounted: false };
    }

    function addWallpostOrder() { orders.push(calc()); render(); }
    function addAccessoryOrder() { orders.push(calcAccessory()); render(); }
    
    function render() {
        const list = document.getElementById('orderList');
        list.innerHTML = "";
        orders.forEach((o, i) => {
            list.innerHTML += `<div class="order-item"><button class="btn-del" onclick="orders.splice(${i},1); render()">✕</button><div>${o.desc} (${o.count} عدد)</div><div>${(o.unit*o.count).toLocaleString()} ت</div></div>`;
        });
        document.getElementById('copyBtn').style.display = orders.length > 0 ? 'block' : 'none';
    }

    function toggleMode() {
        if(sessionStorage.getItem('isPart') === 'true') { sessionStorage.setItem('isPart', 'false'); document.getElementById('badge').innerText = "وضعیت: مشتری"; }
        else if(prompt("رمز همکار:") === "2244") { sessionStorage.setItem('isPart', 'true'); document.getElementById('badge').innerText = "وضعیت: همکار"; }
        calc(); calcAccessory();
    }

    function openAdmin() {
        if(prompt("رمز مدیریت:") !== "1132") return;
        document.getElementById('sSt37').value = settings.st37;
        document.getElementById('sGalv').value = settings.galv;
        document.getElementById('modal').style.display = 'flex';
    }

    function copyEitaa() {
        let txt = "📋 پیش‌فاکتور اطلس سازه\n";
        orders.forEach(o => txt += `\n🔸 ${o.desc}: ${(o.unit*o.count).toLocaleString()} ت`);
        navigator.clipboard.writeText(txt); alert("کپی شد!");
    }

    window.onload = fetchFromCloud;
</script>
</body>
</html>
